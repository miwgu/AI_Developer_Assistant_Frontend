services:
  mysql:
    image: mysql:8.0
    container_name: aida-mysql-container           # Container name for MySQL DB
    restart: always
    environment:
      # MySQL root and user credentials
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"                      # Map MySQL port to host
    volumes:
      - mysql_data:/var/lib/mysql        # Persist database data
    networks:
      - aida-net-db

  aida-frontend:
    build:
      context: ./AI_Developer_Assistant_Frontend
      dockerfile: Dockerfile
    container_name: aida-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL}
    ports:
      - "4173:4173"
    networks:
      - aida-net-frontend
    depends_on:
      - aida-backend

  aida-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aida-backend         # Container name for backend
    ports:
      - "3001:3001"                      # Expose backend port to host
    environment:
      # Backend app DB connection environment variables
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}               # Use service name for DB host
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    networks:
      - aida-net-frontend
      - aida-net-db
    extra_hosts:
        - "host.docker.internal:host-gateway"    
    depends_on:
      - mysql

networks:
  aida-net-db:
    driver: bridge
  aida-net-frontend:
    driver: bridge

volumes:
  mysql_data: