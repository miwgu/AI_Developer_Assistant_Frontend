services:
  postgres:
    image: ankane/pgvector:latest                     #use pgvector 
    container_name: aida-postgres-container           # Container name for PostgreSQL DB
    restart: always
    environment:
      # PostgreSQL root and user credentials
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"                      # Map PostgreSQL port to host
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data        # Persist database data
    networks:
      - aida-net-db

  aida-frontend:
    build:
      context: ./AI_Developer_Assistant_Frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL:  ${VITE_BACKEND_URL}   # <-- Pass build arg here
    container_name: aida-frontend
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    ports:
      - "4173:4173"
    networks:
      - aida-net-frontend
    depends_on:
      - aida-backend

  aida-backend:
    build:
      context: ./AI_Developer_Assistant_Backend
      dockerfile: Dockerfile
    container_name: aida-backend         # Container name for backend
    ports:
      - "3000:3000"                      # Expose backend port to host
    environment:
      # Backend app DB connection environment variables
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}               # Use service name for DB host
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    networks:
      - aida-net-frontend
      - aida-net-db
    extra_hosts:
        - "host.docker.internal:host-gateway"    
    depends_on:
      - postgres

networks:
  aida-net-db:
    driver: bridge
  aida-net-frontend:
    driver: bridge

volumes:
  postgres_data: